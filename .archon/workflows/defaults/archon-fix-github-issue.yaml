name: archon-fix-github-issue
description: |
  Use when: User wants to FIX, RESOLVE, or IMPLEMENT a solution for a GitHub issue.
  Triggers: "fix this issue", "implement issue #123", "resolve this bug", "fix it",
            "fix issue", "resolve issue", "fix #123".
  NOT for: Comprehensive multi-agent reviews (use archon-issue-review-full),
           questions about issues, CI failures, PR reviews, general exploration.

  DAG workflow that:
  1. Classifies the issue (bug/feature/enhancement/etc)
  2. Researches context (web research + codebase exploration via investigate/plan)
  3. Routes to investigate (bugs) or plan (features) based on classification
  4. Implements the fix/feature with validation
  5. Creates a draft PR using the repo's PR template
  6. Runs smart review (always code review + CLAUDE.md check, conditional additional agents)
  7. Aggressively self-fixes all findings (tests, docs, error handling)
  8. Simplifies changed code (implements fixes directly, not just reports)
  9. Reports results back to the GitHub issue with follow-up suggestions

provider: claude
model: sonnet
interactive: true

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 0: LOAD MEMORY
  # ═══════════════════════════════════════════════════════════════

  - id: load-memory
    bash: |
      if command -v bd &>/dev/null && [ -d ".beads" ]; then
        echo "=== AGENT LESSONS ==="
        bd list --label lesson --status open --json 2>/dev/null || echo "[]"
        echo ""
        echo "=== MEMORIES ==="
        bd memories 2>/dev/null || echo "none"
      else
        echo "no beads configured"
      fi

  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH & CLASSIFY
  # ═══════════════════════════════════════════════════════════════

  - id: extract-issue-number
    depends_on: [load-memory]
    prompt: |
      Find the GitHub issue number for this request.

      Request: $ARGUMENTS

      Rules:
      - If the message contains an explicit issue number (e.g., "#709", "issue 709", "709"), extract that number.
      - If the message is ambiguous (e.g., "fix the SQLite timestamp bug"), use `gh issue list` to search for matching issues and pick the best match.

      CRITICAL: Your final output must be ONLY the bare number with no quotes, no markdown, no explanation. Example correct output: 709

  - id: fetch-issue
    bash: |
      # Strip quotes, whitespace, markdown backticks from AI output
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      if [ -z "$ISSUE_NUM" ]; then
        echo "Failed to extract issue number from: $extract-issue-number.output" >&2
        exit 1
      fi
      gh issue view "$ISSUE_NUM" --json title,body,labels,comments,state,url,author
    depends_on: [extract-issue-number]

  - id: classify
    prompt: |
      You are an issue classifier. Analyze the GitHub issue below and determine its type.

      ## Issue Content

      $fetch-issue.output

      ## Classification Rules

      | Type | Indicators |
      |------|------------|
      | bug | "broken", "error", "crash", "doesn't work", stack traces, regression |
      | feature | "add", "new", "support", "would be nice", net-new capability |
      | enhancement | "improve", "better", "update existing", "extend", incremental improvement |
      | refactor | "clean up", "simplify", "reorganize", "restructure" |
      | chore | "update deps", "upgrade", "maintenance", "CI/CD" |
      | documentation | "docs", "readme", "clarify", "examples" |

      Provide reasoning for your classification.
    depends_on: [fetch-issue]
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type:
          type: string
          enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]
        title:
          type: string
        reasoning:
          type: string
      required: [issue_type, title, reasoning]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: RESEARCH (parallel with PR template fetch)
  # ═══════════════════════════════════════════════════════════════

  - id: web-research
    command: archon-web-research
    depends_on: [classify]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: INVESTIGATE (bugs) / PLAN (features)
  # ═══════════════════════════════════════════════════════════════

  - id: investigate
    command: archon-investigate-issue
    depends_on: [classify, web-research]
    when: "$classify.output.issue_type == 'bug'"
    context: fresh

  - id: plan
    command: archon-create-plan
    depends_on: [classify, web-research]
    when: "$classify.output.issue_type != 'bug'"
    context: fresh

  # Bridge: ensure investigation.md exists for the implement step
  # archon-fix-issue reads from $ARTIFACTS_DIR/investigation.md
  # archon-create-plan writes to $ARTIFACTS_DIR/plan.md
  # This node copies plan.md → investigation.md when the plan path was taken
  - id: bridge-artifacts
    bash: |
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then
        cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md"
        echo "Bridged plan.md to investigation.md for implement step"
      elif [ -f "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "investigation.md exists from investigate step"
      else
        echo "WARNING: No investigation.md or plan.md found — implement may fail"
      fi
    depends_on: [investigate, plan]
    trigger_rule: one_success

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3b: APPROVAL GATE
  # Show the user what was understood and planned before implementing
  # ═══════════════════════════════════════════════════════════════

  - id: review-plan
    depends_on: [bridge-artifacts]
    model: claude-opus-4-6[1m]
    loop:
      prompt: |
        # Plan Review — Interactive Gate

        The user is reviewing the investigation/plan before implementation starts.

        **User's feedback**: $LOOP_USER_INPUT

        ## Context

        - **Issue:** $ARGUMENTS
        - **Type:** $classify.output.issue_type — $classify.output.title
        - **Classification reasoning:** $classify.output.reasoning

        ## Step 1: Read the Plan

        Read `$ARTIFACTS_DIR/investigation.md` (or `$ARTIFACTS_DIR/plan.md` if it exists).

        ## Step 2: Process User Input

        **If no user feedback yet** (first iteration, $LOOP_USER_INPUT is empty):
        - Present a clear summary of:
          1. What the problem is (root cause for bugs, scope for features)
          2. What files will be changed and how
          3. What tests will be added/modified
          4. Any risks or trade-offs
        - Ask the user to review
        - Do NOT emit the completion signal on the first iteration

        **If the user EXPLICITLY approved** (said "approved", "ok", "go", "looks good", "давай", "ок"):
        - Make no changes
        - Output: "Plan approved. Proceeding to implementation."
        - Signal completion: <promise>PLAN_APPROVED</promise>

        **If the user provided feedback or corrections:**
        - Parse the feedback
        - Update `$ARTIFACTS_DIR/investigation.md` with the requested changes
        - Present the updated plan summary
        - Ask: "Updated the plan. Review again or say 'approved' to start implementation."
        - Do NOT emit the signal

        **CRITICAL**: NEVER emit <promise>PLAN_APPROVED</promise> unless the user's latest
        message EXPLICITLY approves. Questions, corrections, concerns are NOT approval.
      until: PLAN_APPROVED
      max_iterations: 10
      interactive: true
      gate_message: |
        Review the plan above. Provide feedback on what to change,
        or say "approved" to begin implementation.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    command: archon-fix-issue
    depends_on: [review-plan]
    context: fresh
    model: claude-opus-4-6[1m]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VALIDATE
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5b: ADVERSARIAL REVIEW (Codex)
  # Independent model challenges the implementation
  # ═══════════════════════════════════════════════════════════════

  - id: codex-challenge
    depends_on: [validate]
    context: fresh
    provider: codex
    model: gpt-5.4
    idle_timeout: 3600000
    prompt: |
      You are an adversarial code reviewer. A different AI model just implemented
      a fix for a GitHub issue. Your job is to CHALLENGE the implementation — find
      problems the original model missed due to its own blind spots.

      ## Issue Context

      $fetch-issue.output

      ## Classification

      Type: $classify.output.issue_type
      Title: $classify.output.title

      ## What Was Done

      The implementation is in the current working directory. The validation
      step confirmed that type-check, lint, and tests pass.

      ## Your Review Checklist

      Run `git diff $BASE_BRANCH...HEAD` to see all changes, then evaluate:

      ### 1. Root Cause vs Symptom
      - Does the fix address the ACTUAL root cause?
      - Or does it just suppress the symptom (e.g., catching an error instead of preventing it)?
      - Could the same bug reappear in a different form?

      ### 2. Edge Cases
      - What inputs or conditions were NOT tested?
      - Are there boundary conditions (empty arrays, null values, concurrent access)?
      - What happens under load or with unexpected data?

      ### 3. Side Effects
      - Does the fix change behavior of any OTHER functionality?
      - Are there callers of the modified code that might break?
      - Run: `grep -rn "function_name" --include="*.ts"` for each modified function

      ### 4. Simpler Alternative
      - Is there a simpler way to achieve the same fix?
      - Is the fix over-engineered for the problem?
      - Could fewer lines of code solve this?

      ### 5. Test Quality
      - Do the tests actually verify the FIX, or just the happy path?
      - Is there a regression test that would catch this bug if it reappeared?
      - Are tests deterministic (no timing, no network dependency)?

      ## Output Format

      Return a JSON object:
      ```json
      {
        "verdict": "PASS" | "NEEDS_FIXES",
        "critical_issues": [
          {"description": "...", "file": "...", "suggestion": "..."}
        ],
        "minor_issues": [
          {"description": "...", "file": "...", "suggestion": "..."}
        ],
        "positive_notes": ["what was done well"]
      }
      ```

      If no critical or minor issues found, set verdict to "PASS" with empty arrays.
      Be thorough but fair — don't flag things that aren't real problems.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5c: FIX ADVERSARIAL FINDINGS
  # Claude fixes issues found by Codex (only if needed)
  # ═══════════════════════════════════════════════════════════════

  - id: fix-challenge
    depends_on: [codex-challenge]
    when: "$codex-challenge.output.verdict == 'NEEDS_FIXES'"
    context: fresh
    model: claude-opus-4-6[1m]
    idle_timeout: 3600000
    prompt: |
      An independent reviewer (Codex) found issues with your implementation.
      Fix them.

      ## Adversarial Review Results

      $codex-challenge.output

      ## Instructions

      1. Read each critical_issue and minor_issue
      2. For each issue:
         - Read the file mentioned
         - Understand the concern
         - Implement the fix
      3. After all fixes, run the full validation suite:
         ```bash
         bun run type-check && bun run lint && bun run test
         ```
      4. If validation fails, fix until it passes
      5. Commit all changes: `git add -A && git commit -m "fix: address adversarial review findings"`

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5d: RE-VALIDATE
  # Ensure everything still passes after adversarial fixes
  # ═══════════════════════════════════════════════════════════════

  - id: re-validate
    command: archon-validate
    depends_on: [codex-challenge, fix-challenge]
    trigger_rule: one_success
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: CREATE DRAFT PR
  # ═══════════════════════════════════════════════════════════════

  - id: create-pr
    prompt: |
      Create a draft pull request for the current branch.

      ## Context

      - **Issue**: $ARGUMENTS
      - **Classification**: $classify.output
      - **Issue title**: $classify.output.title

      ## Instructions

      1. Check git status — ensure all changes are committed. If uncommitted changes exist, stage and commit them.
      2. Push the branch: `git push -u origin HEAD`
      3. Read implementation artifacts from `$ARTIFACTS_DIR/` for context:
         - `$ARTIFACTS_DIR/investigation.md` or `$ARTIFACTS_DIR/plan.md`
         - `$ARTIFACTS_DIR/implementation.md`
         - `$ARTIFACTS_DIR/validation.md`
      4. Check if a PR already exists for this branch: `gh pr list --head $(git branch --show-current)`
         - If PR exists, skip creation and capture its number
      5. Look for the project's PR template at `.github/pull_request_template.md`, `.github/PULL_REQUEST_TEMPLATE.md`, or `docs/PULL_REQUEST_TEMPLATE.md`. Read whichever one exists.
      6. Create a DRAFT PR: `gh pr create --draft --base $BASE_BRANCH`
         - Title: concise, imperative mood, under 70 chars
         - Body: if a PR template was found, fill in **every section** with details from the artifacts. Don't skip sections or leave placeholders. If no template, write a body with summary, changes, validation evidence, and `Fixes #...`.
         - Link to issue: include `Fixes #...` or `Closes #...`
      7. Capture PR identifiers:
         ```bash
         PR_NUMBER=$(gh pr view --json number -q '.number')
         echo "$PR_NUMBER" > "$ARTIFACTS_DIR/.pr-number"
         PR_URL=$(gh pr view --json url -q '.url')
         echo "$PR_URL" > "$ARTIFACTS_DIR/.pr-url"
         ```
    depends_on: [re-validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: REVIEW
  # ═══════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [create-pr]
    context: fresh

  - id: review-classify
    prompt: |
      You are a PR review classifier. Analyze the PR scope and determine
      which review agents should run.

      ## PR Scope

      $review-scope.output

      ## Rules

      - **Code review**: ALWAYS run. This is mandatory for every PR. It also checks
        the PR against CLAUDE.md rules and project conventions.
      - **Error handling**: Run if the diff touches code with try/catch, error handling,
        async/await, or adds new failure paths.
      - **Test coverage**: Run if the diff touches source code (not just tests, docs, or config).
      - **Comment quality**: Run if the diff adds or modifies comments, docstrings, JSDoc,
        or significant documentation within code files.
      - **Docs impact**: Run if the diff adds/removes/renames public APIs, commands, CLI flags,
        environment variables, or user-facing features.

      Provide your reasoning for each decision.
    depends_on: [review-scope]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        reasoning:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - reasoning

  # Code review always runs — mandatory
  - id: code-review
    command: archon-code-review-agent
    depends_on: [review-classify]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_error_handling == 'true'"
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_test_coverage == 'true'"
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_comment_quality == 'true'"
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_docs_impact == 'true'"
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: SYNTHESIZE + SELF-FIX
  # ═══════════════════════════════════════════════════════════════

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  - id: self-fix
    command: archon-self-fix-all
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: SIMPLIFY
  # ═══════════════════════════════════════════════════════════════

  - id: simplify
    command: archon-simplify-changes
    depends_on: [self-fix]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: UPDATE DOCUMENTATION
  # ═══════════════════════════════════════════════════════════════

  - id: update-docs
    depends_on: [simplify]
    context: fresh
    model: sonnet
    prompt: |
      # Update Project Documentation

      Code changes are complete. Update any documentation affected by these changes.

      ## Step 1: Check what changed
      ```bash
      git diff $BASE_BRANCH..HEAD --stat
      git diff $BASE_BRANCH..HEAD --name-only
      ```

      ## Step 2: Read project docs
      Check which docs exist:
      ```bash
      ls README.md CLAUDE.md docs/ 2>/dev/null
      ```

      ## Step 3: Update only affected docs
      - **README.md** — if new features, APIs, or usage patterns were added
      - **CLAUDE.md** — if new conventions or architectural patterns emerged
      - **docs/** files — if specific documentation exists for changed areas
      - **API docs** — if endpoints or interfaces changed
      - **Config docs** — if new configuration options were added

      Rules:
      - Only update docs that are ACTUALLY affected by the code changes
      - Don't touch docs for unchanged areas
      - Don't create new doc files unless explicitly needed
      - Keep updates concise and factual

      ## Step 4: Commit if changes were made
      ```bash
      git add -A
      git diff --cached --quiet || git commit -m "docs: update documentation for recent changes"
      ```

      If no docs need updating, output "No documentation updates needed" and skip commit.

      ## Step 5: Verify all changes are committed
      ```bash
      git status --porcelain
      ```
      If there are uncommitted files, stage and commit them:
      ```bash
      git add -A
      git diff --cached --quiet || git commit -m "chore: commit remaining uncommitted changes"
      ```
      Verify clean state:
      ```bash
      git status
      ```
      If working directory is NOT clean after this — something is wrong. Report it in your output.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 11: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: archon-issue-completion-report
    depends_on: [update-docs]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 12: SAVE MEMORY
  # ═══════════════════════════════════════════════════════════════

  - id: save-memory
    depends_on: [report]
    bash: |
      command -v bd &>/dev/null && [ -d ".beads" ] || exit 0
      bd remember "Completed: archon-fix-github-issue — issue fixed and PR created" 2>/dev/null || true
