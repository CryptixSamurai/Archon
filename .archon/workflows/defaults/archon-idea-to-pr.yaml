name: archon-idea-to-pr
description: |
  Use when: You have a feature idea or description and want end-to-end development.
  Input: Feature description in natural language, or path to a PRD file
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Create comprehensive implementation plan with codebase analysis
  2. Setup branch and extract scope limits
  3. Verify plan research is still valid
  4. Implement all tasks with type-checking
  5. Run full validation suite
  6. Create PR with template, mark ready
  7. Comprehensive code review (5 parallel agents with scope limit awareness)
  8. Synthesize and fix review findings
  9. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Executing existing plans (use archon-plan-to-pr), quick fixes, standalone reviews.

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 0: LOAD MEMORY
  # ═══════════════════════════════════════════════════════════════════

  - id: load-memory
    bash: |
      if command -v bd &>/dev/null && [ -d ".beads" ]; then
        echo "=== AGENT LESSONS ==="
        bd list --label lesson --status open --json 2>/dev/null || echo "[]"
        echo ""
        echo "=== MEMORIES ==="
        bd memories 2>/dev/null || echo "none"
      else
        echo "no beads configured"
      fi

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: CREATE PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: create-plan
    command: archon-create-plan
    context: fresh
    depends_on: [load-memory]

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    depends_on: [create-plan]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh
    model: claude-opus-4-6[1m]

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement-tasks]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [finalize-pr]
    context: fresh

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: UPDATE DOCUMENTATION
  # ═══════════════════════════════════════════════════════════════════

  - id: update-docs
    depends_on: [implement-fixes]
    context: fresh
    model: sonnet
    prompt: |
      # Update Project Documentation

      Code changes are complete. Update any documentation affected by these changes.

      ## Step 1: Check what changed
      ```bash
      git diff $BASE_BRANCH..HEAD --stat
      git diff $BASE_BRANCH..HEAD --name-only
      ```

      ## Step 2: Read project docs
      Check which docs exist:
      ```bash
      ls README.md CLAUDE.md docs/ 2>/dev/null
      ```

      ## Step 3: Update only affected docs
      - **README.md** — if new features, APIs, or usage patterns were added
      - **CLAUDE.md** — if new conventions or architectural patterns emerged
      - **docs/** files — if specific documentation exists for changed areas
      - **API docs** — if endpoints or interfaces changed
      - **Config docs** — if new configuration options were added

      Rules:
      - Only update docs that are ACTUALLY affected by the code changes
      - Don't touch docs for unchanged areas
      - Don't create new doc files unless explicitly needed
      - Keep updates concise and factual

      ## Step 4: Commit if changes were made
      ```bash
      git add -A
      git diff --cached --quiet || git commit -m "docs: update documentation for recent changes"
      ```

      If no docs need updating, output "No documentation updates needed" and skip commit.

      ## Step 5: Verify all changes are committed
      ```bash
      git status --porcelain
      ```
      If there are uncommitted files, stage and commit them:
      ```bash
      git add -A
      git diff --cached --quiet || git commit -m "chore: commit remaining uncommitted changes"
      ```
      Verify clean state:
      ```bash
      git status
      ```
      If working directory is NOT clean after this — something is wrong. Report it in your output.

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 9: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [update-docs]
    context: fresh

  - id: save-memory
    depends_on: [workflow-summary]
    bash: |
      command -v bd &>/dev/null && [ -d ".beads" ] || exit 0
      bd remember "Completed: archon-idea-to-pr — idea developed into PR with review" 2>/dev/null || true
